name: Component request
description: Suggest a new component or variant.
labels: ["component request"]
body:
  - type: input
    id: name
    attributes:
      label: Component
      placeholder: e.g. Combobox, Library card, Index tabs
    validations:
      required: true
  - type: textarea
    id: paper-object
    attributes:
      label: Which paper object should it feel like?
      description: Every Ephemera component imitates a real piece of stationery. What's this one?
      placeholder: A card-catalogue drawer you can type into…
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What would you use it for?
    validations:
      required: true
  - type: checkboxes
    id: shadcn
    attributes:
      label: shadcn/ui
      options:
        - label: shadcn/ui has an equivalent component (please link it below)
  - type: textarea
    id: extra
    attributes:
      label: References
      description: Links, photos of the real object, sketches.
